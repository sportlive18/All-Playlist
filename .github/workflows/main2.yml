name: Merge and Organize M3U Playlists

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes (minimum recommended)
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run merge script
        run: python merge.py

      - name: Always commit (with or without changes)
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"
          
          # Check if there are changes
          git add combined.m3u
          
          if git diff --staged --quiet; then
            # No changes - create a heartbeat commit
            echo "No playlist changes, creating heartbeat update"
            echo "⏰ Last checked: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > .last_check
            git add .last_check
            git commit -m "💓 Heartbeat $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          else
            # Changes detected - commit the updates
            git commit -m "🤖 Update M3U playlist $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          fi
          
          git push
