name: Merge and Organize M3U Playlists
on:
  push:
    branches: [main]        # adjust if your default branch is different
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes 
  workflow_dispatch:

concurrency:
  group: merge-playlist
  cancel-in-progress: false   # queue overlapping runs instead of racing each other

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run merge script
        run: python merge.py

      - name: Always commit (with or without changes)
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"

          git add combined.m3u

          if git diff --staged --quiet; then
            echo "No playlist changes, creating heartbeat update"
            echo "⏰ Last checked: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > .last_check
            git add .last_check
            git commit -m "💓 Heartbeat $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          else
            git commit -m "🤖 Update M3U playlist $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          fi

          # Retry once with rebase if remote has moved ahead (e.g. overlapping/queued run)
          git push || (git pull --rebase origin main && git push)
