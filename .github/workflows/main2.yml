name: Merge M3U Playlists with EPG

on:
  schedule:
    - cron: '0 */1 * * *'  # Every 1 hour
  workflow_dispatch:         # Manual trigger

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and merge playlists (with separate sections)
        run: |
          # Create temporary files
          TEMP_FILE="combined_temp.m3u"
          FINAL_FILE="combined.m3u"
          
          # Start with extended M3U header including EPG URLs
          cat > "$FINAL_FILE" << 'EOF'
          #EXTM3U x-tvg-url="https://www.tsepg.cf/epg.xml.gz|https://avkb.short.gy/tsepg.xml.gz"
          
          EOF

          # Define URL groups with their section headers
          declare -A sections
          sections["FANCODE"]="https://raw.githubusercontent.com/doctor-8trange/zyphx8/refs/heads/main/data/fancode.m3u"
          sections["SONYLIV"]="https://raw.githubusercontent.com/drmlive/sliv-live-events/refs/heads/main/sonyliv.m3u"
          sections["WILLOW"]="https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.m3u"
          sections["PRIMEVIDEO"]="https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/primevideo_sports.m3u"
          sections["JIO-TV"]="https://raw.githubusercontent.com/sportlive18/jio-tv-auto-update-playlist/refs/heads/main/jtv2.m3u"
          sections["ZEE"]="https://raw.githubusercontent.com/sportlive18/jio-tv-auto-update-playlist/refs/heads/main/zee.m3u"
          sections["SONY"]="https://raw.githubusercontent.com/sportlive18/jio-tv-auto-update-playlist/refs/heads/main/sony.m3u"
          sections["SUN"]="https://raw.githubusercontent.com/sportlive18/jio-tv-auto-update-playlist/refs/heads/main/sun.m3u"

          # Add main stream
          echo "#EXTINF:-1 group-title=\"📺 STREAMSTAR\",===== STREAMSTAR CHANNELS =====" >> "$FINAL_FILE"
          echo "" >> "$FINAL_FILE"
          curl -s "https://l3.streamstar18.workers.dev" | grep -E "^#EXTINF:" -A1 | grep -v "^--$" >> "$FINAL_FILE" || true
          echo "" >> "$FINAL_FILE"

          # Process each section
          for section in "FANCODE" "SONYLIV" "WILLOW" "PRIMEVIDEO" "JIO-TV" "ZEE" "SONY" "SUN"; do
            url="${sections[$section]}"
            echo "📥 Fetching: $section from $url"
            
            # Add section header
            echo "#EXTINF:-1 group-title=\"📺 $section\",===== $section CHANNELS =====" >> "$FINAL_FILE"
            echo "" >> "$FINAL_FILE"
            
            # Fetch content and extract channels
            content=$(curl -s "$url" || echo "")
            
            if [ -n "$content" ]; then
              # Remove header if present and extract channel entries
              echo "$content" | grep -E "^#EXTINF:" -A1 | grep -v "^--$" >> "$FINAL_FILE" || true
              
              # Count channels in this section
              count=$(echo "$content" | grep -c "^#EXTINF:" || echo "0")
              echo "  ✅ Added $count channels from $section"
            else
              echo "  ⚠️ Failed to fetch $section"
            fi
            
            # Add separator
            echo "" >> "$FINAL_FILE"
          done

          # Clean up: Remove duplicate lines and empty lines
          sed -i '/^#EXTM3U/d' "$FINAL_FILE"
          sed -i '/^[[:space:]]*$/d' "$FINAL_FILE"
          
          # Ensure EPG header is at the top
          if ! grep -q "x-tvg-url" "$FINAL_FILE"; then
            sed -i '1s/^/#EXTM3U x-tvg-url="https:\/\/www.tsepg.cf\/epg.xml.gz|https:\/\/avkb.short.gy\/tsepg.xml.gz"\n/' "$FINAL_FILE"
          fi

          echo "✅ Merged playlist created: $FINAL_FILE"
          
          # Count channels for verification
          channel_count=$(grep -c "^#EXTINF" "$FINAL_FILE" || echo "0")
          echo "📊 Total channels: $channel_count"
          
          # Show file size
          file_size=$(du -h "$FINAL_FILE" | cut -f1)
          echo "📁 File size: $file_size"
          
          # Debug: Show first few lines
          echo "📄 First 10 lines of merged file:"
          head -n 10 "$FINAL_FILE"

      - name: Force update and commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Always stage the file
          git add -f combined.m3u
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "⚠️ No changes detected in the file"
            echo "🔄 Forcing update by touching the file..."
            
            # Force a change by adding a timestamp comment
            echo "" >> combined.m3u
            echo "# Updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> combined.m3u
            
            # Stage again
            git add -f combined.m3u
            
            # Commit with timestamp
            git commit -m "🔄 Force update combined playlist $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          else
            # Commit changes
            git commit -m "🤖 Auto-update combined playlist with EPG $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          fi
          
          # Push changes
          git push || echo "⚠️ Push failed, but changes are committed locally"

      - name: Create backup with timestamp
        if: always()
        run: |
          cp combined.m3u "combined_$(date +'%Y%m%d_%H%M%S').m3u"
          git add "combined_*.m3u" 2>/dev/null || true
          git commit -m "📦 Backup combined playlist $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No backup to commit"
          git push || echo "⚠️ Backup push failed"
