name: Update ZEE Playlist
on:
  schedule:
    - cron: '0 */1 * * *' # Runs every 1 hour
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main
    paths:
      - 's.py'

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    concurrency:
      group: update-playlist
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz
          # Or if you have requirements.txt:
          # pip install -r requirements.txt

      - name: Run s.py
        run: python s.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"
          git add s.json
          git add playlist.m3u
          git commit -m "Auto-update playlists: $(date)" || echo "No changes to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push failed, retrying in 5s... (attempt $i)"
            sleep 5
          done
